<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>База знаний — Отдел оформления</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{--graphite:#29303E;--berry:#951b81;--g1:#831F82;--g2:#C7017F;--g3:#E30613;
--bg:#F4F5F8;--card:#fff;--text:#29303E;--muted:#6b7385;--line:#e1e4ec;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2430;--card:#29303E;--text:#f2f3f7;--muted:#9aa2b5;--line:#3a4252;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f2430;--card:#29303E;--text:#f2f3f7;--muted:#9aa2b5;--line:#3a4252;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Montserrat,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.grad{background:linear-gradient(100deg,var(--g1),var(--g2) 60%,var(--g3))}
/* splash */
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 38%,#3a4256 0,#29303E 45%,#1b2029 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .7s ease,transform .7s ease,visibility .7s;padding:24px;border:0;width:100%;color:#fff;font-family:inherit}
#splash.hide{opacity:0;transform:scale(1.15);visibility:hidden;pointer-events:none}
#splash img{width:min(72vw,420px,60vh);height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45));animation:float 4s ease-in-out infinite}
#splash .hint{margin-top:28px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.75;animation:pulse 2s ease-in-out infinite}
#splash .bar{margin-top:14px;width:64px;height:4px;border-radius:2px}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{opacity:.3}}
/* app */
#app{opacity:0;transition:opacity .6s ease .2s}
#app.show{opacity:1}
header{background:var(--graphite);color:#fff;padding:22px 20px 26px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(100deg,var(--g1),var(--g2) 60%,var(--g3))}
.top{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{background:#fff;border-radius:999px;padding:9px 18px;display:flex}
.logo img{height:20px;width:auto}
.back{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:8px 14px;font:600 12px Montserrat,sans-serif;cursor:pointer}
.hero{max-width:1100px;margin:26px auto 0;display:flex;gap:20px;align-items:center}
.hero img{width:78px;height:auto;flex:none}
.hero h1{font-size:clamp(20px,4.6vw,34px);font-weight:700;line-height:1.2}
.hero p{margin-top:6px;font-size:13px;opacity:.7}
main{max-width:1100px;margin:0 auto;padding:22px 16px 40px}
.search{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:500 15px Montserrat,sans-serif;outline:none}
.search:focus{border-color:var(--berry);box-shadow:0 0 0 3px rgba(149,27,129,.2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:20px}.tile{border:0;text-align:left;color:#fff;background:var(--graphite);border-radius:20px;padding:22px 20px 20px;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .15s}.tile:hover{transform:translateY(-3px)}.tile::before{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;transform:rotate(45deg);background:linear-gradient(100deg,var(--g1),var(--g2) 60%,var(--g3));border-radius:12px;opacity:.9}.tile b{font-size:18px;font-weight:700}.tile small{margin-top:6px;font-size:12px;opacity:.7;line-height:1.4}.sechead{display:flex;align-items:center;gap:12px;margin-top:20px}.sechead button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:9px 16px;font:600 13px Montserrat,sans-serif;cursor:pointer}.sechead h2{margin:0}.tabs{display:flex;gap:8px;margin:18px 0;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:600 13px Montserrat,sans-serif;cursor:pointer}
.tab.on{background:linear-gradient(100deg,var(--g1),var(--g2) 60%,var(--g3));color:#fff;border-color:transparent}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:10px;height:10px;transform:rotate(45deg);background:var(--berry)}
.note{font-size:12px;color:var(--muted);margin:-4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--berry)}
.card h3{font-size:15px;font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{text-decoration:none;font:600 12px Montserrat,sans-serif;padding:8px 13px;border-radius:10px;color:#fff;background:var(--graphite);border:1px solid var(--line)}
.links a:hover{background:var(--berry)}
.card.one{cursor:pointer}
.empty{color:var(--muted);font-size:13px;padding:14px 4px}
section[hidden]{display:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 16px 30px}
</style>
</head>
